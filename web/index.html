<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F6F7FB">
<title>Kairos</title>
<style>
:root{
  --accent:#FF5B1F; --brand:#FF5B1F; --bg:#F6F7FB; --surface:#fff; --text:#16181D; --muted:#8A90A0; --track:#ECEEF4;
  --green:#22B07D; --blue:#3A94D0; --purple:#6A55D3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#E6E9F1}
body{margin:0;color:var(--text);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#E6E9F1}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);padding:20px 20px 110px;overflow-x:hidden}
h1{font-size:30px;margin:6px 0 16px;font-weight:700;letter-spacing:-.3px}
.muted{color:var(--muted)}.small{font-size:12px}
.card{background:var(--surface);border-radius:28px;padding:22px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center}
.pill{display:inline-block;border-radius:50px;padding:4px 11px;font-size:11px;font-weight:600;letter-spacing:.3px}
.btn{border:0;border-radius:50px;padding:11px 24px;font:inherit;font-weight:600;background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
a{color:var(--accent)}
select,input[type=number]{font:inherit;padding:9px 14px;border-radius:16px;border:1px solid var(--track);background:#fff;color:var(--text)}
input[type=checkbox].sw{width:22px;height:22px;accent-color:var(--accent)}
label.opt{display:flex;justify-content:space-between;align-items:center;padding:10px 0}

/* Encabezado estilo Smart Life */
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px}
.top .sel{position:relative;font-size:22px;color:#555C6B}
.top select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font-size:22px;color:#555C6B;padding:4px 22px 4px 0;max-width:260px;text-overflow:ellipsis}
.top .sel:after{content:"";position:absolute;right:2px;top:50%;margin-top:-3px;border:6px solid transparent;border-top-color:#555C6B;border-bottom:0;pointer-events:none}
.fab{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:28px;line-height:1;cursor:pointer;box-shadow:0 6px 14px rgba(255,91,31,.35)}

/* Tarjeta calma (Smart Life) */
.calm{border-radius:30px;padding:30px 28px;margin-bottom:16px;position:relative;overflow:hidden;background:linear-gradient(160deg,#DCEBFF 0%,#EEF5FF 55%,#fff 100%)}
.calm:before{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,#FFF6DC 0%,rgba(255,246,220,0) 70%)}
.calm .big{font-size:42px;font-weight:700;letter-spacing:-1px;margin:6px 0 22px;position:relative}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative}
.stats3 b{display:block;font-size:20px;font-weight:700}
.stats3 span{font-size:12px;color:var(--muted)}

/* Tarjeta de alerta (Huawei) */
.alertcard{padding:22px 20px 18px}
.alertcard .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:2px}
.alertcard .head b{font-size:18px}
.arcs{display:block;margin:0 auto}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);margin-top:6px}
.metrics>div{padding:0 8px;border-left:1px solid var(--track)}
.metrics>div:first-child{border-left:0;padding-left:0}
.metrics .lab{font-size:13px;color:#444;display:flex;align-items:center;gap:5px}
.metrics .dot{width:7px;height:7px;border-radius:50%}
.metrics .num{font-size:32px;font-weight:600;line-height:1.15;letter-spacing:-1px}
.metrics .unit{font-size:12px;color:var(--muted)}
.strip{display:flex;align-items:center;gap:10px;background:#F3F4F8;border-radius:50px;padding:10px 12px 10px 18px;margin-top:16px}
.strip .t{flex:1;font-size:13px;color:#444;min-width:0}
.strip .t b{display:block;font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip button{border:0;border-radius:50px;background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:13px;padding:8px 16px;cursor:pointer}

/* Botones de escena de colores */
.scenes{display:flex;gap:12px;overflow-x:auto;margin:0 -20px 18px;padding:0 20px;scrollbar-width:none}
.scenes::-webkit-scrollbar{display:none}
.scene{flex:none;border:0;border-radius:50px;padding:20px 30px;font:inherit;font-size:19px;font-weight:600;color:#fff;cursor:pointer}

/* Fila de módulos (Huawei) */
.mods{display:flex;justify-content:space-between;padding:20px 12px 16px}
.mods button{border:0;background:none;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;width:25%;color:var(--text);font-size:12px;text-align:center;line-height:1.2}
.mods .ic{position:relative;width:54px;height:54px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:26px}
.mods .badge{position:absolute;right:-8px;bottom:-6px;background:#fff;border-radius:50px;font-size:10px;font-weight:700;padding:1px 6px;box-shadow:0 2px 6px rgba(0,0,0,.12)}

/* Tarjetas 2 columnas */
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.two .card{margin:0;padding:20px 18px;min-height:150px;display:flex;flex-direction:column}
.two .ttl{font-weight:600;font-size:15px}
.two .val{font-size:34px;font-weight:600;letter-spacing:-1px;margin-top:6px}
.two .val small{font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0}
.mini{margin-top:auto}

/* Pestañas */
.tabs{display:flex;gap:26px;overflow-x:auto;margin:0 -20px 16px;padding:0 20px 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:none;font:inherit;font-size:20px;color:#9AA0AE;padding:6px 0;cursor:pointer}
.tabs button.on{color:var(--text);font-weight:700}
.phase{grid-column:1/-1;font-size:13px;color:var(--muted);margin:10px 4px 0;display:flex;justify-content:space-between}

/* Tarjetas tipo dispositivo (Smart Life) */
.devs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.dev{background:#fff;border-radius:26px;padding:18px 16px 14px;cursor:pointer;display:flex;flex-direction:column;gap:14px}
.dev.open{grid-column:1/-1}
.dev .tp{display:flex;justify-content:space-between;align-items:flex-start}
.dev .ic{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px}
.pw{width:46px;height:46px;border-radius:50%;border:0;background:#D6D9E1;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pw.on{background:#1FD1A0}
.pw.lock{background:#EEF0F5;color:#B9BECB;cursor:not-allowed}
.pw svg{width:22px;height:22px}
.dev .nm{font-size:17px;font-weight:500;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dev.open .nm{display:block}
.dev.done .nm{color:#9AA0AE;text-decoration:line-through}
.dev .bt{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);gap:6px}
.dev .bt i{font-style:normal;color:#FF9D00;font-weight:500}
.dev .chev{flex:none;transition:transform .2s}
.dev.open .chev{transform:rotate(180deg)}
.dev .det{font-size:14px;color:#555C6B;line-height:1.45}
.dev .det .shop{margin-top:10px;background:#F3F4F8;border-radius:14px;padding:10px 12px;font-size:13px}

/* Barra inferior */
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -6px 22px rgba(30,40,80,.08)}
nav div{max-width:430px;margin:0 auto;display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:12px 0 14px;font:inherit;font-size:12px;color:#7D8393;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button svg{width:30px;height:30px}
nav button.on{color:var(--accent)}
@media(min-width:460px){#app{margin-top:0;box-shadow:0 0 40px rgba(30,40,80,.12)}}

/* Noticias oficiales */
.newshead{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 8px}
.newshead h2{margin:0;font-size:22px;font-weight:700}
.lnk{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;font-size:14px;cursor:pointer;padding:4px 0}
.tabs.sm{gap:20px}.tabs.sm button{font-size:15px}
.news{display:flex;gap:14px;align-items:center;background:#fff;border-radius:24px;padding:16px 18px;margin-bottom:12px;text-decoration:none;color:inherit}
.news .nb{flex:1;min-width:0}
.news .nt{font-weight:600;font-size:15px;line-height:1.3;margin:8px 0 6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.news img{width:76px;height:76px;border-radius:18px;object-fit:cover;flex:none;background:#EEF0F5}

/* Pronóstico */
.fc{padding:20px 18px}
.fcnow{font-size:46px;font-weight:600;letter-spacing:-2px;line-height:1.1;display:flex;align-items:center;gap:8px}
.fcnow span{font-size:34px;letter-spacing:0}
.fcdays{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.fcd{border-radius:18px;padding:10px 2px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.fci{font-size:24px;line-height:1.3}
.fctags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fctags .pill{font-size:12px;padding:6px 12px;line-height:1.3}

/* Selector de radio */
.rad{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.rad button{border:0;border-radius:50px;padding:9px 16px;font:inherit;font-size:14px;font-weight:600;background:#fff;color:var(--text);cursor:pointer}
.rad button.on{background:var(--accent);color:#fff}
.rad button:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>
<div id="app"></div>
<nav><div id="nav"></div></nav>

<script>
/* ===== Modelo (espejo de Models.kt) ===== */
const HAZARDS = {HURRICANE:'Huracán / tormenta tropical', FLOOD:'Inundación', EXTREME_HEAT:'Calor extremo', WATER_SCARCITY:'Escasez hídrica'};
const SEV = ['GREEN','YELLOW','ORANGE','RED'];
const SEV_LABEL = {GREEN:'Verde',YELLOW:'Amarilla',ORANGE:'Naranja',RED:'Roja'};
const SEV_ACCENT = {GREEN:'#12C27E',YELLOW:'#FFB800',ORANGE:'#FF7A00',RED:'#FF3B4A'};
const SEV_HERO = {
  GREEN:['#0BA36B','#2EE59D'], YELLOW:['#D99100','#FFC53D'], ORANGE:['#E85D00','#FF9A2E'], RED:['#D91E36','#FF5A6A']};
const CATS = {SAFETY:'Seguridad personal', ASSETS:'Aseguramiento de bienes', PETS:'Planes para mascotas', SHELTER:'Alternativas de refugio'};
const CAT_COLOR = {SAFETY:'#1F8BFF', ASSETS:'#8B5CF6', PETS:'#FF7A1A', SHELTER:'#00C2B3'};
const PHASES = ['ONGOING','EARLY','MINUS_12','MINUS_2','POST_IMPACT'];
const PHASE_LABEL = {ONGOING:'Durante la alerta',EARLY:'Preparación',MINUS_12:'Fase -12 horas',MINUS_2:'Fase -2 horas',POST_IMPACT:'Post-impacto'};
const REGIONS = {
  'sw-guerrero': {name:'Suroeste (Acapulco, Guerrero)', box:[-106,14,-96,20]},
  'ne-tamaulipas-nl': {name:'Noreste (Tamaulipas y Monterrey)', box:[-101.5,22,-93,28]},
};
const HOUR = 3600000, MIN = 60000;

/* ===== Reglas (espejo de ChecklistEngine.kt) ===== */
const ALL = Object.keys(HAZARDS), WATER=['HURRICANE','FLOOD'], STORM=['HURRICANE'], FLOODH=['FLOOD'], HEAT=['EXTREME_HEAT'], SCAR=['WATER_SCARCITY'];
const NOT_SCAR = ALL.filter(h=>h!=='WATER_SCARCITY');
const S='SAFETY',A='ASSETS',P='PETS',H='SHELTER';
const prod=(n,price)=>({name:n,price});
const KIT=prod('Kit de emergencia familiar 72 h',1250), SHUT=prod('Tormenteras para ventanas (juego)',2300),
      BARR=prod('Barrera anti-inundación para puerta',1890), TANK=prod('Bidones de agua de 20 L (x4) con filtro',980);
const st=(id,title,detail,pri,min,hb,cat=S,product=null)=>({id,title,detail,pri,min,hb,cat,product});
const R=(hz,sev,step,o={})=>({hz,sev:SEV.indexOf(sev),step,when:o.when||null,post:!!o.post});
const RULES=[
 R(NOT_SCAR,'GREEN',st('kit','Revisa tu kit de emergencia','Agua (3 L por persona al día), alimentos no perecederos, linterna, botiquín y radio de pilas.',5,30,72,S,KIT)),
 R(NOT_SCAR,'YELLOW',st('charge','Carga celulares y baterías externas','Deja los equipos al 100 % y baja el brillo de pantalla.',4,15,24)),
 R(STORM,'YELLOW',st('secure-outdoor','Asegura objetos en patio y azotea','Tinacos, macetas, láminas y muebles ligeros pueden volverse proyectiles.',4,30,24,A)),
 R(STORM,'YELLOW',st('shutters','Protege ventanas y puertas','Cubre los vidrios con tormenteras o madera y cierra bien puertas.',3,60,24,A,SHUT)),
 R(FLOODH,'YELLOW',st('flood-route','Ubica tu ruta a zona alta','Evita cauces, arroyos y calles que se anegan.',4,20,24,H)),
 R(WATER,'ORANGE',st('docs','Guarda documentos en bolsa impermeable','Identificaciones, escrituras, póliza de seguro y recetas.',3,15,12,A)),
 R(WATER,'ORANGE',st('route','Confirma tu ruta al refugio oficial','Identifica el refugio temporal más cercano y una ruta alterna hacia zona alta.',3,20,12,H)),
 R(WATER,'ORANGE',st('alt-shelter','Elige un refugio alterno','Casa de un familiar o vecino en zona alta, por si el refugio oficial se llena.',3,15,12,H)),
 R(WATER,'RED',st('utilities','Corta gas y electricidad','Hazlo antes de salir o si el agua empieza a entrar a la vivienda.',2,10,3)),
 R(WATER,'RED',st('evacuate','Evacúa al refugio indicado por Protección Civil','Sal con tu mochila de emergencia y sigue las rutas oficiales.',1,60,6,H)),
 R(STORM,'RED',st('shelter-in-place','Si no evacuaste, resguárdate lejos de ventanas','Ve al cuarto interior más resistente, con tu mochila y agua. No salgas durante el ojo del huracán.',1,10,2,H)),
 R(FLOODH,'RED',st('flood-high','Sube al nivel más alto y no cruces corrientes','Treinta centímetros de agua en movimiento pueden arrastrarte.',1,10,2)),
 R(HEAT,'YELLOW',st('hydrate','Aumenta hidratación y evita el sol','Evita actividad al aire libre de 11:00 a 17:00.',3,10,0)),
 R(HEAT,'ORANGE',st('cool-room','Prepara un espacio fresco en casa','Cierra cortinas de día y ventila de noche.',2,30,0)),
 R(HEAT,'RED',st('heat-center','Acude a un centro de enfriamiento o a un lugar con clima','Si tu casa supera 32 °C en el interior, pasa las horas de más calor fuera de ella.',1,45,0,H)),
 R(SCAR,'YELLOW',st('ws-store','Almacena agua: 3 L por persona al día','Apunta a una reserva para 7 días en recipientes limpios y tapados.',2,30,0,A,TANK)),
 R(SCAR,'YELLOW',st('ws-reduce','Reduce el consumo del hogar','Regadera de 4 minutos, reutiliza agua de lavado y revisa fugas.',4,15,0)),
 R(SCAR,'ORANGE',st('ws-supply','Ubica pipas y puntos de abasto','Anota los horarios de tandeo y los puntos de reparto cercanos.',2,20,0,H)),
 R(SCAR,'RED',st('ws-priority','Prioriza agua para beber y cocinar','Suspende lavado de autos, riego y limpieza con manguera.',1,10,0)),
 R(WATER,'YELLOW',st('ground-lift','Sube enseres y documentos a un nivel alto','Tu vivienda en planta baja es la primera en inundarse: eleva electrodomésticos, colchones y papeles.',2,45,18,A),{when:p=>p.groundFloor}),
 R(WATER,'ORANGE',st('flood-barrier','Instala barreras anti-inundación','Coloca barreras en puertas y rejillas para frenar la entrada de agua.',2,60,18,A,BARR),{when:p=>p.groundFloor}),
 R(WATER,'ORANGE',st('ground-relocate','Planea salir de la planta baja','Acuerda con un vecino de piso alto o ve al refugio antes de que suba el nivel del agua.',1,30,12,H),{when:p=>p.groundFloor}),
 R(WATER,'YELLOW',st('kids-bag','Prepara la mochila de las niñas y niños','Agua, comida, ropa seca, medicinas, copia de acta y una cobija o juguete.',3,20,24),{when:p=>p.hasChildren}),
 R(WATER,'ORANGE',st('kids-meeting','Define un punto de reunión familiar','Que todos lo conozcan; avisa a la escuela y a un familiar fuera de la zona.',2,15,12),{when:p=>p.hasChildren}),
 R(STORM,'RED',st('kids-calm','Mantén a las niñas y niños contigo','Quédense juntos en el cuarto seguro; usa su juguete y su mochila para mantener la calma.',2,5,2),{when:p=>p.hasChildren}),
 R(HEAT,'ORANGE',st('heat-kids','Hidrata a las niñas y niños cada hora','Nunca los dejes solos en un vehículo y evita juegos al sol directo.',1,10,0),{when:p=>p.hasChildren}),
 R(ALL,'YELLOW',st('elder-meds','Reúne medicinas para al menos 72 horas','Incluye recetas, equipo médico cargado y lentes.',2,25,36),{when:p=>p.hasElderly}),
 R(WATER,'ORANGE',st('elder-transfer','Organiza su traslado con anticipación','Requiere más tiempo: pide ayuda a vecinos o a Protección Civil y sal antes de la alerta roja.',1,40,18,H),{when:p=>p.hasElderly}),
 R(HEAT,'ORANGE',st('heat-elder','Revísalas cada 2 horas por golpe de calor','Mareo, confusión o piel seca y caliente: llévalas a la sombra y pide ayuda médica.',1,10,0),{when:p=>p.hasElderly}),
 R(SCAR,'ORANGE',st('ws-vulnerable','Reserva primero el agua para niñez y adultos mayores','Aparta su agua de beber antes de cualquier otro uso.',2,10,0),{when:p=>p.hasElderly||p.hasChildren}),
 R(WATER,'YELLOW',st('pets-kit','Prepara el kit de tu mascota','Alimento y agua para 3 días, correa, transportadora, cartilla y una foto reciente.',3,20,24,P),{when:p=>p.hasPets}),
 R(WATER,'ORANGE',st('pets-shelter','Ubica refugios que admitan mascotas','Muchos refugios no las aceptan: confirma uno o un familiar que pueda recibirla.',2,20,12,P),{when:p=>p.hasPets}),
 R(WATER,'RED',st('pets-carrier','Ten a tu mascota en su transportadora, contigo','Con collar e identificación, lista para salir si evacúas.',2,5,2,P),{when:p=>p.hasPets}),
 R(HEAT,'YELLOW',st('heat-pets','Protege a tu mascota del calor','Agua fresca siempre, sombra y paseos solo temprano o de noche.',3,10,0,P),{when:p=>p.hasPets}),
 R(SCAR,'YELLOW',st('ws-pets','Aparta agua para tu mascota','Calcula su consumo diario dentro de tu reserva.',3,5,0,P),{when:p=>p.hasPets}),
 R(WATER,'YELLOW',st('post-safe','Avisa a tu familia que estás bien','Mensajes cortos; las llamadas pueden saturar la red.',1,5,0),{post:true}),
 R(WATER,'YELLOW',st('post-hazards','Evita agua estancada y cables caídos','No camines ni manejes por zonas inundadas ni toques instalaciones eléctricas mojadas.',1,5,0),{post:true}),
 R(WATER,'ORANGE',st('post-water','Hierve o clora el agua antes de beber','Hierve el agua 1 minuto o usa gotas de cloro apto para consumo.',2,15,0),{post:true}),
 R(WATER,'YELLOW',st('post-damage','Documenta daños con fotos y video','Útil para tu seguro y para solicitar apoyos antes de limpiar.',3,30,0,A),{post:true}),
 R(WATER,'YELLOW',st('post-elder','Revisa su salud y medicinas','Confirma que tengan sus medicinas y que no haya signos de deshidratación.',2,15,0),{post:true,when:p=>p.hasElderly}),
 R(WATER,'YELLOW',st('post-pets','Revisa a tu mascota','Agua limpia, alimento y atención veterinaria si hay heridas o decaimiento.',3,15,0,P),{post:true,when:p=>p.hasPets}),
];

function generate(profile, alert, zoneHigh){
  const sev = zoneHigh ? Math.min(SEV.indexOf(alert.severity)+1,3) : SEV.indexOf(alert.severity);
  const hasImpact = alert.impact != null;
  const phaseOf = r => !hasImpact ? 'ONGOING' : r.post ? 'POST_IMPACT' : r.step.hb>12 ? 'EARLY' : r.step.hb>2 ? 'MINUS_12' : 'MINUS_2';
  const seen = new Set();
  return RULES.filter(r => r.hz.includes(alert.hazard) && sev>=r.sev && (!r.when||r.when(profile)) && (!r.post||hasImpact))
    .map(r=>({...r.step, phase:phaseOf(r)}))
    .filter(s=>!seen.has(s.id)&&seen.add(s.id))
    .sort((a,b)=>PHASES.indexOf(a.phase)-PHASES.indexOf(b.phase)||a.pri-b.pri||b.hb-a.hb);
}
function unlockAt(phase, impact){
  if(impact==null) return 0;
  return {ONGOING:0,EARLY:0,MINUS_12:impact-12*HOUR,MINUS_2:impact-2*HOUR,POST_IMPACT:impact}[phase];
}
const isUnlocked=(s,alert,now)=>now>=unlockAt(s.phase,alert.impact);

/* ===== Estado ===== */
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const state={
  tab:'home', planFilter:null, now:Date.now(), loading:true, real:[],
  region:load('region','sw-guerrero'),
  profile:load('profile',{groundFloor:false,hasChildren:false,hasElderly:false,hasPets:false}),
  zoneHigh:load('zoneHigh',false),
  sim:load('sim',null),   // {hazard,severity,issued,impact}
  done:load('done',{}),
};

/* ===== NASA EONET (espejo de NasaEonetSource.kt) ===== */
function stormSeverity(w){ return w==null?'YELLOW': w<34?'GREEN': w<64?'YELLOW': w<96?'ORANGE':'RED'; }
function firstCoord(c){ let n=c; while(Array.isArray(n)&&Array.isArray(n[0])) n=n[0]; return Array.isArray(n)&&n.length>=2?n:null; }
function parseEonet(json, regionId, now){
  const [x0,y0,x1,y1]=REGIONS[regionId].box, out=[];
  for(const ev of json.events||[]){
    const cat=ev.categories&&ev.categories[0]&&ev.categories[0].id;
    const hazard = cat==='severeStorms'?'HURRICANE': cat==='floods'?'FLOOD':null; if(!hazard) continue;
    const pts=(ev.geometry||[]).map(g=>({t:Date.parse(g.date),g})).filter(p=>!isNaN(p.t)&&p.t<=now).sort((a,b)=>b.t-a.t);
    if(!pts.length) continue;
    const {t,g}=pts[0]; if(now-t>72*HOUR) continue;
    const c=firstCoord(g.coordinates); if(!c) continue;
    if(!(c[0]>=x0&&c[0]<=x1&&c[1]>=y0&&c[1]<=y1)) continue;
    const wind=typeof g.magnitudeValue==='number'?g.magnitudeValue:null;
    out.push({id:ev.id,hazard,severity:hazard==='HURRICANE'?stormSeverity(wind):'YELLOW',
      headline:`${ev.title}${wind!=null?` (vientos de ${Math.round(wind)} nudos)`:''}`,issued:t,impact:null,simulated:false,source:'NASA EONET'});
  }
  return out;
}

  state.loading=true; render();

  try{
    const r=await fetch(`https://eonet.gsfc.nasa.gov/api/v3/events?status=open&category=severeStorms,floods&bbox=${x0},${y1},${x1},${y0}`);
    state.real = r.ok ? parseEonet(await r.json(), state.region, Date.now()) : [];
  }catch(e){ state.real=[]; }
  state.loading=false; state.now=Date.now(); render();
}

/* Arco de 270° con la abertura abajo, como el anillo de Huawei Health */
function arcPath(cx,cy,r,p){
  const sweep=p>=1?270:Math.max(1,270*Math.max(0,p)), a0=135*Math.PI/180, a1=(135+sweep)*Math.PI/180;
  return `M${cx+r*Math.cos(a0)} ${cy+r*Math.sin(a0)} A${r} ${r} 0 ${sweep>180?1:0} 1 ${cx+r*Math.cos(a1)} ${cy+r*Math.sin(a1)}`;
}
function arcs(ps,centerText){
  const rs=[100,72,44], grad=['gr','gy','gb'], track=['#FDE6E1','#FFF1CC','#E0ECFF'];

    <linearGradient id="gy" gradientUnits="userSpaceOnUse" x1="48" y1="170" x2="190" y2="50"><stop offset="0" stop-color="#FFAE00"/><stop offset="1" stop-color="#FFDD4A"/></linearGradient>
    <linearGradient id="gb" gradientUnits="userSpaceOnUse" x1="76" y1="150" x2="164" y2="80"><stop offset="0" stop-color="#2F6BFF"/><stop offset="1" stop-color="#4FC3FF"/></linearGradient></defs>`+
    rs.map((r,i)=>`<path d="${arcPath(120,112,r,1)}" fill="none" stroke="${track[i]}" stroke-width="24" stroke-linecap="round"/>`+

/* Una zona de peligro alto sube un nivel la severidad efectiva del plan (misma regla que el motor). */
function zoneHighFor(hazard){
  const g=state.zone&&state.zone.hazards&&state.zone.hazards[hazard];
  return g&&g.grade?!!g.high:state.zoneHigh;   // sin dato del Atlas, se respeta el ajuste manual
}
function locate(){
  if(!navigator.geolocation){ state.zoneStatus='unsupported'; render(); return; }
  state.zoneStatus='locating'; render();
  navigator.geolocation.getCurrentPosition(
    p=>fetchZone(p.coords.latitude,p.coords.longitude,'gps'),
    e=>{ state.zoneStatus=e.code===1?'denied':'error'; render(); },
    {enableHighAccuracy:false,timeout:15000,maximumAge:600000});
}
function useRegionRef(){ const c=REGION_REF[state.region]; state.zoneStatus='locating'; render(); fetchZone(c[0],c[1],'region'); }
async function fetchZone(lat,lon,mode){
  try{
    // POST: las coordenadas van en el cuerpo y no en la URL.
    const r=await fetch('/api/hazards',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lat,lon})});
    if(r.status===404){ state.zoneStatus='outside'; render(); return; }
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    state.zone={municipio:d.municipio,estado:d.estado,hazards:d.hazards,mode,partial:!!d.partial}; save('zone',state.zone); state.zoneStatus=null;
    state.loc=mode==='gps'?{lat:Math.round(lat*100)/100,lon:Math.round(lon*100)/100}:null; save('loc',state.loc);
    // Si cae dentro de una región piloto, se cambia sola: el usuario no tiene que elegirla.
    for(const [k,v] of Object.entries(REGIONS)){
      const [x0,y0,x1,y1]=v.box;
      if(mode==='gps'&&lon>=x0&&lon<=x1&&lat>=y0&&lat<=y1&&state.region!==k){ state.region=k; save('region',k); refreshReal(); refreshForecast(); break; }
    }
  }catch(e){ state.zoneStatus='error'; }
  render();
  if(state.zone&&state.zoneStatus===null) refreshNews();   // el servidor marca qué comunicados nombran tu municipio
}
function clearZone(){ state.zone=null; state.zoneStatus=null; state.loc=null; save('zone',null); save('loc',null); render(); refreshNews(); }

/* Código WMO de Open-Meteo -> icono y texto */
function wx(code){
  if(code==null) return ['·','Sin dato'];
  if(code===0) return ['☀️','Despejado'];
  if(code<=2) return ['🌤️','Poco nublado'];
  if(code===3) return ['☁️','Nublado'];
  if(code===45||code===48) return ['🌫️','Niebla'];
  if(code<=57) return ['🌦️','Llovizna'];
  if(code<=67) return ['🌧️','Lluvia'];
  if(code<=77) return ['❄️','Nieve'];
  if(code<=82) return ['🌧️','Chubascos'];
  if(code>=95) return ['⛈️','Tormenta'];
  return ['☁️','Nublado'];
}
/* Umbrales simples sobre sensación térmica máxima y lluvia acumulada del día */
function heatLevel(d){ const t=d.feelsMax!=null?d.feelsMax:d.max; return t==null?0:t>=40?2:t>=35?1:0; }
function rainLevel(d){ const r=d.rain||0, p=d.prob||0; return r>=50?3:r>=20?2:(r>=5&&p>=60)?1:0; }
function forecastSection(){
  const f=state.forecast;
  let h=`<div class="newshead"><h2>Pronóstico de calor y lluvia</h2><button class="lnk" onclick="refreshForecast()">Actualizar</button></div>`;
  if(f.loading&&!f.data) return h+`<div class="card muted">Cargando pronóstico…</div>`;
  if(f.error||!f.data) return h+`<div class="card muted">No se pudo cargar el pronóstico. <button class="btn ghost" onclick="refreshForecast()">Reintentar</button></div>`;
  const d=f.data, cur=d.current||{}, [ic,txt]=wx(cur.code);
  const wd=(iso,i)=>i===0?'Hoy':new Date(iso+'T12:00:00').toLocaleDateString('es-MX',{weekday:'short'}).replace('.','');
  const r0=v=>v==null?'–':Math.round(v);
  // Agrupa los días por tipo de aviso para no repetir etiquetas.
  const names=d.days.map((x,i)=>wd(x.date,i)), join=a=>a.length>1?a.slice(0,-1).join(', ')+' y '+a[a.length-1]:a[0];
  const pick=(fn)=>d.days.map((x,i)=>fn(x)?i:-1).filter(i=>i>=0);
  const tags=[];
  const extreme=pick(x=>heatLevel(x)===2), high=pick(x=>heatLevel(x)===1);
  const maxFeels=Math.max(...d.days.map(x=>x.feelsMax==null?-99:x.feelsMax));
  if(extreme.length) tags.push(['🔥',`Calor extremo: ${join(extreme.map(i=>names[i]))} (sensación hasta ${r0(maxFeels)}°)`,'#E8261C']);
  if(high.length) tags.push(['🌡️',`Calor alto: ${join(high.map(i=>names[i]))}${extreme.length?'':' (sensación hasta '+r0(maxFeels)+'°)'}`,'#FF7A00']);
  const strong=pick(x=>rainLevel(x)>=2), likely=pick(x=>rainLevel(x)===1);
  if(strong.length) tags.push(['🌧️',`Lluvia fuerte: ${join(strong.map(i=>names[i]+' '+r0(d.days[i].rain)+' mm'))}`,'#2F6BFF']);
  if(likely.length) tags.push(['🌦️',`Lluvia probable: ${join(likely.map(i=>names[i]+' '+r0(d.days[i].rain)+' mm'))}`,'#3A94D0']);
  h+=`<div class="card fc"><div class="row" style="justify-content:space-between;align-items:flex-start">
      <div><div class="muted small">${esc(d.place)} · ahora</div><div class="fcnow">${r0(cur.temp)}°<span>${ic}</span></div>
      <div class="muted small">${txt}${cur.feels!=null?' · sensación '+r0(cur.feels)+'°':''}</div></div>
      ${pill('5 DÍAS','#FF5B1F')}</div>
    <div class="fcdays">`+d.days.map((x,i)=>{
      const hl=heatLevel(x), rl=rainLevel(x), [dic]=wx(x.code);
      const bg=hl?(hl===2?'#FFE3E1':'#FFF0DD'):rl?'#E6F0FF':'#F3F4F8';
      return `<div class="fcd" style="background:${bg}"><div class="small muted">${wd(x.date,i)}</div><div class="fci">${dic}</div>
        <b>${r0(x.max)}°</b><div class="small muted">${r0(x.min)}°</div><div class="small" style="color:#2F6BFF">💧${r0(x.rain)}</div></div>`;
    }).join('')+`</div>`+
    (tags.length?`<div class="fctags">`+tags.map(([i,t,c])=>`<span class="pill" style="background:${c}1F;color:${c}">${i} ${esc(t)}</span>`).join('')+`</div>`
      :`<div class="muted small" style="margin-top:12px">Sin calor extremo ni lluvia fuerte en los próximos 5 días.</div>`)+
    `<div class="muted small" style="margin-top:12px">Lluvia en mm por día. Calor según sensación térmica. Datos: <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo.com</a> (CC BY 4.0). Es un pronóstico de referencia: sigue siempre los avisos oficiales.</div></div>`;
  return h;
}

function ago(iso){

  if(ms<HOUR) return 'hace '+Math.max(1,Math.round(ms/MIN))+' min';
  if(ms<24*HOUR) return 'hace '+Math.round(ms/HOUR)+' h';
  if(ms<7*24*HOUR) return 'hace '+Math.round(ms/(24*HOUR))+' d';
  return new Date(iso).toLocaleDateString('es-MX',{day:'numeric',month:'short'});
}
/* Zona de interés: estado(s) del municipio detectado (o de la región) + cuenca ciclónica de su costa */
const REGION_STATES={'sw-guerrero':['Guerrero'],'ne-tamaulipas-nl':['Tamaulipas','Nuevo León']};
const BASIN_STATES={
  pacific:['Baja California','Baja California Sur','Sonora','Sinaloa','Nayarit','Jalisco','Colima','Michoacán','Guerrero','Oaxaca','Chiapas'],
  atlantic:['Tamaulipas','Veracruz','Tabasco','Campeche','Yucatán','Quintana Roo','Nuevo León','Coahuila']};
const BASIN_LABEL={pacific:'Pacífico',atlantic:'Atlántico y Golfo'};
const fold=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
/* Compara nombres de estado: tolera acentos y los nombres largos oficiales ("Michoacán de Ocampo"), sin confundir "Baja California" con "Baja California Sur" */
function sameState(a,b){
  const x=fold(a),y=fold(b);
  return x===y||x.startsWith(y+' de ')||y.startsWith(x+' de ')||(x==='mexico'&&y==='estado de mexico')||(y==='mexico'&&x==='estado de mexico');
}
function interest(){
  const z=state.zone, states=z&&z.estado?[z.estado]:(REGION_STATES[state.region]||[]);
  const basins=Object.keys(BASIN_STATES).filter(b=>states.some(s=>BASIN_STATES[b].some(t=>sameState(s,t))));
  return {states, basins:basins.length?basins:Object.keys(BASIN_STATES), muni:z&&z.municipio?fold(z.municipio).split(' de ')[0]:'', region:state.region};
}
function inZone(i,z){
  const st=i.states||[];
  if(st.some(s=>z.states.some(t=>sameState(s,t)))) return true;          // menciona tu estado
  if((i.regions||[]).includes(z.region)) return true;                    // evento dentro de tu región
  if(z.muni.length>=4&&fold(i.title).includes(z.muni)) return true;      // menciona tu municipio
  return !st.length&&(i.basins||[]).some(b=>z.basins.includes(b));       // aviso de cuenca sin estados: aplica a la costa de tu zona
}
function setNewsScope(s){ state.news.scope=s; state.news.all=false; render(); }
function setRadius(v){ state.radius=v==='region'?'region':Number(v); save('radius',state.radius); state.news.all=false; render(); }

/* Distancia en km entre dos puntos (haversine) */
function km(a,b){
  const R=6371, rad=x=>x*Math.PI/180, dLat=rad(b.lat-a.lat), dLon=rad(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const REGION_KM=250;                                      // "toda la región" para eventos con coordenadas
const radiusNow=()=>state.loc?state.radius:'region';      // sin ubicación no hay radio
function distTo(i){ return state.loc&&i.geo?km(state.loc,i.geo):null; }
/* Qué noticias se muestran según el radio elegido */
function visible(i,z){
  const r=radiusNow();
  if(i.areal) return inZone(i,z);                         // ciclones y avisos de cuenca: abarcan cientos de km, se filtran por región
  if(i.geo){                                              // sismos, inundaciones: distancia real
    const d=distTo(i);
    if(d==null) return inZone(i,z);
    return r==='region'?(d<=REGION_KM||inZone(i,z)):d<=r;
  }
  return r==='region'?inZone(i,z):i.muni===true;          // comunicados: no traen coordenadas, solo se pueden ligar por mención del municipio
}

function newsSection(){
  const n=state.news, z=interest(), r=radiusNow(), hasLoc=!!state.loc;
  const where=state.zone&&state.zone.municipio?`${state.zone.municipio}${state.zone.estado?', '+state.zone.estado:''}`:z.states.join(' y ');
  const scopeTxt=r==='region'?(z.basins.length===1?` · ${BASIN_LABEL[z.basins[0]]}`:''):` · a ${r} km de ti`;
  const kinds=[['all','Todas'],['proteccion-civil','Protección Civil'],['gobierno','Gobierno'],['usgs','Sismos'],['nasa','NASA'],['noaa','NOAA'],['gdacs','GDACS']];
  let h=`<div class="newshead" id="news"><h2>Noticias de tu zona</h2><button class="lnk" onclick="refreshNews()">Actualizar</button></div>
    <div class="muted small" style="margin:-2px 0 10px">📍 ${esc(where)}${scopeTxt}${state.zone?'':' · según tu región; detecta tu zona para afinarla'}</div>
    <div class="rad">`+[[5,'5 km'],[10,'10 km'],[20,'20 km'],['region','Toda la región']].map(([v,l])=>
      `<button class="${r===v?'on':''}" ${!hasLoc&&v!=='region'?'disabled':''} onclick="setRadius('${v}')">${l}</button>`).join('')+`</div>`;
  h+=!hasLoc?`<div class="muted small" style="margin:-4px 0 10px">Para usar 5, 10 o 20 km necesitamos tu ubicación: pulsa <b>Usar mi ubicación</b> en la tarjeta de tu zona.</div>`
    :r!=='region'?`<div class="muted small" style="margin:-4px 0 10px">Con radio: sismos e inundaciones por distancia real; comunicados solo si nombran tu municipio; ciclones según tu región.</div>`:'';
  h+=`<div class="tabs sm">`+kinds.map(([k,l])=>`<button class="${n.filter===k?'on':''}" onclick="setNewsFilter('${k}')">${l}</button>`).join('')+`</div>`;
  if(n.loading&&!n.items.length) return h+`<div class="card muted">Cargando noticias de fuentes oficiales…</div>`;
  if(n.error&&!n.items.length) return h+`<div class="card muted">${n.error} <button class="btn ghost" onclick="refreshNews()">Reintentar</button></div>`;
  const outside=n.items.filter(i=>!visible(i,z)).length, all=n.scope==='all';
  const list=(all?n.items:n.items.filter(i=>visible(i,z))).filter(i=>n.filter==='all'||i.kind===n.filter);
  const toggle=outside?`<button class="btn ghost" style="width:100%;margin-bottom:6px" onclick="setNewsScope('${all?'zone':'all'}')">${all?'Solo mi zona':'Incluir nacionales y globales ('+outside+')'}</button>`:'';
  if(!list.length){
    const where2=all?'Sin noticias recientes de esta fuente.':(r==='region'?'No hay noticias recientes de tu zona':'No hay noticias recientes a '+r+' km de ti')+(n.filter!=='all'?' en esta fuente':'')+'.';
    return h+`<div class="card muted">${where2}${!all&&r!=='region'?` <button class="btn ghost" onclick="setRadius('region')">Ampliar a toda la región</button>`:''}</div>`+toggle;
  }
  const shown=n.all?list:list.slice(0,6);
  h+=shown.map(i=>{
    const link=/^https:\/\//.test(i.link)?i.link:'#', img=/^https:\/\//.test(i.image||'')?i.image:'', far=all&&!visible(i,z), d=distTo(i);
    const dist=d!=null?` · a ${d<10?d.toFixed(1):Math.round(d)} km de ti`:'';
    return `<a class="news" href="${esc(link)}" target="_blank" rel="noopener noreferrer"><div class="nb">
      <div class="row" style="gap:8px;flex-wrap:wrap">${pill(KIND_LABEL[i.kind]||i.source,KIND_COLOR[i.kind]||'#8A90A0')}${far?pill('Fuera de tu zona','#8A90A0'):''}<span class="muted small">${ago(i.date)}${i.lang==='en'?' · EN':''}${dist}</span></div>
      <div class="nt">${esc(i.title)}</div><div class="muted small">${esc(i.source)} ↗</div></div>
      ${img?`<img src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</a>`;
  }).join('');
  if(list.length>6) h+=`<button class="btn ghost" style="width:100%;margin-bottom:6px" onclick="state.news.all=!state.news.all;render()">${n.all?'Ver menos':'Ver todas ('+list.length+')'}</button>`;
  h+=toggle;
  return h+`<div class="muted small" style="margin:6px 4px 16px">Fuentes: gob.mx (Protección Civil, Conagua y Segob), NASA, NOAA, USGS y GDACS. Los comunicados no traen coordenadas, por eso el radio solo se aplica a ellos por mención de tu municipio. Se actualizan cada 10 minutos.</div>`;
}

function home(){
  const items=activeAlerts(), t=items[0];
  let h=header();
  if(!t){
    h+=`<div class="calm"><div class="muted">${esc(REGIONS[state.region].name)}</div>
      <div class="big">Todo en calma</div>
      <div class="stats3"><div><b>0</b><span>Alertas activas</span></div><div><b>NASA</b><span>Fuente de datos</span></div>
      <div><b style="color:${state.loading?'#FF9D00':'#22B07D'}">${state.loading?'…':'OK'}</b><span>${state.loading?'Buscando':'Sin riesgo'}</span></div></div></div>
      <div class="scenes">${scene('Simular alerta',"#6A55D3","go('settings')")}${scene('Actualizar',"#3A94D0",'refreshReal();refreshNews();refreshForecast()')}${scene('Mi hogar',"#22B07D","go('settings')")}</div>
      <div class="two"><div class="card"><div class="ttl">Prepárate</div><div class="val">72<small> h</small></div><div class="muted small mini">Kit de emergencia familiar para tres días.</div></div>
      <div class="card"><div class="ttl">Ruta segura</div><div class="val">1<small> plan</small></div><div class="muted small mini">Ubica tu refugio y tu ruta a zona alta.</div></div></div>`;
    h+=zoneCard();
  h+=forecastSection();
  h+=newsSection();
    return h;
  }
  const a=t.alert, steps=t.steps, total=Math.max(1,steps.length), done=doneCount(t);
  const unl=steps.filter(s=>isUnlocked(s,a,state.now)), udone=unl.filter(s=>isDone(a.id,s.id)).length;
  const span=a.impact!=null?a.impact-a.issued:24*HOUR, p3=a.impact!=null&&span<=0?1:clamp01((state.now-a.issued)/span);
  const [tn,tu]=a.impact!=null?hours(a.impact-state.now):hours(state.now-a.issued);
  const tLabel=a.impact!=null?(state.now<a.impact?'Impacto en':'Post-impacto'):'Activa desde';
  const na=nextAction(t), rem=unl.filter(s=>!isDone(a.id,s.id)).reduce((n,s)=>n+s.min,0);
  const nextLocked=steps.filter(s=>!isUnlocked(s,a,state.now)).sort((x,y)=>unlockAt(x.phase,a.impact)-unlockAt(y.phase,a.impact))[0];
  const stripHtml= na ? `<div class="t">Tu siguiente acción<b>${esc(na.title)}</b></div><button onclick="toggle('${a.id}','${na.id}')">Hecho</button>`
    : (done===steps.length ? `<div class="t"><b>¡Plan completo! 🎉</b></div>`
    : `<div class="t">Todo al día<b>${nextLocked?'Siguiente fase en '+fmt(unlockAt(nextLocked.phase,a.impact)-state.now):'Sin pasos pendientes'}</b></div>`);
  h+=`<div class="card alertcard"><div class="head"><div style="min-width:0"><b>${HAZARDS[a.hazard]}</b><div class="muted small">${esc(a.headline)}</div></div>
      <div style="text-align:right;flex:none">${pill('ALERTA '+SEV_LABEL[a.severity].toUpperCase(),SEV_ACCENT[a.severity],true)}${a.simulated?'<div style="margin-top:4px">'+pill('SIMULADO','#8A90A0')+'</div>':''}${zoneHighFor(a.hazard)?'<div style="margin-top:4px">'+pill('ZONA DE PELIGRO ALTO','#E8261C')+'</div>':''}</div></div>
      ${arcs([done/total,unl.length?udone/unl.length:0,p3],Math.floor(done*100/total)+'%')}
      <div class="metrics">
        <div><div class="lab"><span class="dot" style="background:#F0362B"></span>Avance</div><div class="num">${done}</div><div class="unit">/${steps.length} pasos</div></div>
        <div><div class="lab"><span class="dot" style="background:#FFB400"></span>Ahora</div><div class="num">${udone}</div><div class="unit">/${unl.length} activos</div></div>
        <div><div class="lab"><span class="dot" style="background:#2F7BFF"></span>${tLabel}</div><div class="num">${tn}</div><div class="unit">${tu}</div></div>
      </div><div class="strip">${stripHtml}</div></div>
    <div class="scenes">${scene('Siguiente acción',"#22B07D","go('plan',null)")}${scene('Ver plan',"#3A94D0","go('plan',null)")}${scene('Simular',"#6A55D3","go('settings')")}${scene('Alertas',"#FF5B1F","go('alerts')")}${scene('Noticias',"#E8261C","document.getElementById('news').scrollIntoView({behavior:'smooth'})")}</div>
    <div class="card mods">`+Object.keys(CATS).map(c=>{
      const st=steps.filter(s=>s.cat===c), d=st.filter(s=>isDone(a.id,s.id)).length;
      return `<button onclick="go('plan','${c}')"><div class="ic" style="background:${CAT_COLOR[c]}22">${EMO[c]}<span class="badge" style="color:${CAT_COLOR[c]}">${d}/${st.length}</span></div>${CAT_SHORT[c]}</button>`;
    }).join('')+`</div>
    <div class="two"><div class="card"><div class="ttl">${a.impact!=null?'Línea de tiempo':'Duración'}</div>
        <div class="val">${tn}<small> ${tu}</small></div>
        <svg class="mini" width="100%" height="46" viewBox="0 0 120 46"><defs><linearGradient id="lg"><stop offset="0" stop-color="#7BD83B"/><stop offset=".5" stop-color="#FFB400"/><stop offset="1" stop-color="#F0362B"/></linearGradient></defs>
        <path d="M8 34 C28 44, 40 14, 60 26 S92 38, 112 12" fill="none" stroke="url(#lg)" stroke-width="4" stroke-linecap="round"/>
        <circle cx="${8+104*p3}" cy="${34-22*p3}" r="6" fill="#fff" stroke="#F0362B" stroke-width="3"/></svg></div>
      <div class="card"><div class="ttl">Por hacer ahora</div><div class="val">${rem}<small> min</small></div>
        <div class="mini row" style="gap:0"><svg width="84" height="64" viewBox="0 0 84 64"><circle cx="42" cy="20" r="18" fill="#FF8A2A"/><circle cx="25" cy="42" r="18" fill="#8B5CF6"/><circle cx="59" cy="42" r="18" fill="#2CC9B5"/></svg></div></div></div>`;
  h+=zoneCard();
  h+=forecastSection();
  h+=newsSection();
  return h;
}

function plan(){
  const items=activeAlerts();
  let h=header()+`<div class="tabs"><button class="${!state.planFilter?'on':''}" onclick="go('plan',null)">Todos</button>`+
    Object.keys(CATS).map(c=>`<button class="${state.planFilter===c?'on':''}" onclick="go('plan','${c}')">${CAT_SHORT[c]}</button>`).join('')+`</div>`;
  if(!items.length) return h+`<div class="card muted">Sin alertas activas. Pulsa + para simular una y ver el plan completo.</div>`;
  const a=items[0].alert, steps=items[0].steps.filter(s=>!state.planFilter||s.cat===state.planFilter);
  h+=`<div class="devs">`;
  PHASES.filter(p=>steps.some(s=>s.phase===p)).forEach(p=>{
    const group=steps.filter(s=>s.phase===p);
    h+=`<div class="phase"><span>${PHASE_LABEL[p]}</span><span>${group.filter(s=>isDone(a.id,s.id)).length}/${group.length}</span></div>`;
    group.forEach(s=>{
      const key=a.id+':'+s.id, d=isDone(a.id,s.id), unl=isUnlocked(s,a,state.now), open=openKey===key, c=CAT_COLOR[s.cat];
      h+=`<div class="dev ${d?'done':''} ${open?'open':''}" onclick="openStep('${key}')">
        <div class="tp"><div class="ic" style="background:${c}22">${EMO[s.cat]}</div>
          <button class="pw ${d?'on':unl?'':'lock'}" aria-label="Marcar como hecho" onclick="event.stopPropagation();${unl?`toggle('${a.id}','${s.id}')`:''}">${CHECK}</button></div>
        <div class="nm">${esc(s.title)}</div>
        ${open?`<div class="det">${esc(s.detail)}<div class="muted small" style="margin-top:8px">≈ ${s.min} min · ${CATS[s.cat]}</div>
          ${s.product?`<div class="shop">🛒 Opcional: ${esc(s.product.name)} · $${s.product.price} <span class="muted">(datos simulados)</span></div>`:''}</div>`:''}
        <div class="bt"><span>${CAT_SHORT[s.cat]}${unl?'':` <i>· en ${fmt(unlockAt(s.phase,a.impact)-state.now)}</i>`}</span>${CHEV}</div></div>`;
    });
  });
  return h+`</div>`;
}
function openStep(key){ openKey=openKey===key?null:key; render(); }

function render(){
  document.getElementById('app').innerHTML={home,plan,alerts,settings}[state.tab]();
  document.getElementById('nav').innerHTML=NAV.map(([k,l])=>`<button class="${state.tab===k?'on':''}" onclick="go('${k}')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>${l}</button>`).join('');
}

function alerts(){
  const items=activeAlerts();
  let h=`<h1>Alertas</h1><div class="muted" style="margin-bottom:14px">${esc(REGIONS[state.region].name)}</div>`;
  if(!items.length) return h+`<div class="card muted">${state.loading?'Buscando…':'Sin alertas activas.'}</div>`;
  return h+items.map(({alert:a})=>`<div class="card"><div class="row"><i style="width:14px;height:14px;border-radius:50%;background:${SEV_ACCENT[a.severity]}"></i>
    <b style="flex:1">${HAZARDS[a.hazard]}</b><span style="color:${SEV_ACCENT[a.severity]};font-weight:700">${SEV_LABEL[a.severity]}</span></div>
    <div class="muted" style="margin:8px 0">${esc(a.headline)}</div>
    <div class="row">${pill(a.source,'#1F6BFF')} ${a.simulated?pill('SIMULADO','#9AA5B8'):''}<span class="muted small">hace ${fmt(state.now-a.issued)}</span></div></div>`).join('');
}

function settings(){
  const s=state.sim||{hazard:'HURRICANE',severity:'ORANGE',hours:30};
  const opts=(o,sel)=>Object.entries(o).map(([k,v])=>`<option value="${k}" ${k===sel?'selected':''}>${v}</option>`).join('');
  return `<h1>Ajustes</h1>
  <div class="card"><b>Región piloto</b><div style="margin-top:10px"><select id="reg" onchange="setRegion(this.value)">${opts(Object.fromEntries(Object.entries(REGIONS).map(([k,v])=>[k,v.name])),state.region)}</select></div>
    <button class="btn ghost" style="padding-left:0" onclick="refreshReal()">Actualizar alertas de NASA</button></div>
  <div class="card"><b>Tu hogar</b><div class="muted small">Personaliza el plan. Se guarda solo en este navegador.</div>
    ${[['groundFloor','Vivienda en planta baja'],['hasChildren','Niñas y niños'],['hasElderly','Personas adultas mayores'],['hasPets','Mascotas']].map(([k,l])=>
      `<label class="opt">${l}<input class="sw" type="checkbox" ${state.profile[k]?'checked':''} onchange="setProfile('${k}',this.checked)"></label>`).join('')}
    ${state.zone?`<div class="muted small" style="padding:8px 0">Tu zona se detecta con los mapas del CENAPRED (${esc(state.zone.municipio)}). Se muestra en Inicio.</div>`
      :`<label class="opt">Zona de riesgo alto (manual)<input class="sw" type="checkbox" ${state.zoneHigh?'checked':''} onchange="setZone(this.checked)"></label>
        <button class="btn ghost" style="padding-left:0" onclick="go('home');locate()">Detectar automáticamente</button>`}</div>
  <div class="card"><b>Simulación</b><div class="muted small" style="margin-bottom:10px">Crea una alerta de prueba para ver el tablero completo.</div>
    <label class="opt">Amenaza<select id="sh">${opts(HAZARDS,s.hazard)}</select></label>
    <label class="opt">Severidad<select id="ss">${opts(SEV_LABEL,s.severity)}</select></label>
    <label class="opt">Impacto en (horas)<input id="sd" type="number" min="0" max="72" value="${s.hours||30}" style="width:90px"></label>
    <div class="row" style="margin-top:8px"><button class="btn" onclick="startSim()">Activar</button><button class="btn ghost" onclick="stopSim()">Quitar</button></div></div>
  <div class="card"><b>Datos y privacidad</b><p class="muted small">Tu perfil y tu avance se guardan solo en este navegador y no se envían a ningún servidor. La página consulta NASA EONET y el servidor de Kairos, que reúne noticias oficiales y el pronóstico de Open-Meteo; esas consultas solo indican la región piloto, nunca datos de tu hogar. Si detectas tu zona, tu ubicación (redondeada a ~1 km) viaja en el cuerpo de una petición para consultar el Atlas Nacional de Riesgos del CENAPRED y no se guarda en el servidor. En este navegador se recuerdan tu municipio, su grado de peligro y esa ubicación aproximada, solo para medir distancias. Al pedir noticias se envía únicamente el nombre de tu municipio y estado.</p>
    <button class="btn ghost" style="padding-left:0" onclick="resetAll()">Borrar mis datos</button></div>`;
}

/* ===== Acciones ===== */
function go(tab,filter){ state.tab=tab; if(filter!==undefined) state.planFilter=filter; scrollTo(0,0); render(); }
function toggle(aid,sid){ const k=aid+':'+sid; if(state.done[k]) delete state.done[k]; else state.done[k]=true; save('done',state.done); render(); }
function setRegion(r){ state.region=r; save('region',r); refreshReal(); refreshForecast(); }
function setProfile(k,v){ state.profile[k]=v; save('profile',state.profile); }
function setZone(v){ state.zoneHigh=v; save('zoneHigh',v); }
function startSim(){
  const hours=Math.max(0,Math.min(72,+document.getElementById('sd').value||0)), now=Date.now();
  state.sim={hazard:document.getElementById('sh').value,severity:document.getElementById('ss').value,hours,issued:now,
    impact:['EXTREME_HEAT','WATER_SCARCITY'].includes(document.getElementById('sh').value)?null:now+hours*HOUR};
  save('sim',state.sim); state.now=now; state.tab='home'; render();
}
function stopSim(){ state.sim=null; save('sim',null); render(); }
function resetAll(){ ['done','sim','profile','zoneHigh','region','zone','loc','radius'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
  state.done={};state.sim=null;state.profile={groundFloor:false,hasChildren:false,hasElderly:false,hasPets:false};state.zoneHigh=false; state.zone=null; state.zoneStatus=null; state.loc=null; state.radius='region'; render(); }

setInterval(()=>{ state.now=Date.now(); if(state.tab!=='settings') render(); },60000);
render(); refreshReal(); refreshNews(); refreshForecast();
// Si el usuario ya dio permiso de ubicación antes, la zona se actualiza sola (nunca se vuelve a pedir permiso aquí).
try{ if(navigator.permissions&&navigator.geolocation) navigator.permissions.query({name:'geolocation'}).then(p=>{ if(p.state==='granted') locate(); }).catch(()=>{}); }catch(e){}
</script>
